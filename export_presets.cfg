[preset.0]
name="Quest Pro Hands"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="LICENSE,THIRD_PARTY.md,licenses/*,assets/Neucha-OFL.txt,addons/godotopenxrvendors/meta/LICENSE*,addons/godotopenxrvendors/khronos/LICENSE"
exclude_filter="qa/*,tests/*,tools/*,docs/*,.github/*,.local-tools.json,dependencies.json,README.md,CONTRIBUTING.md,assets/*PROMPT*,assets/game-concept*,assets/characters.png,build/*"
export_path="build/LastChaykaBender-Quest.apk"

[preset.0.options]
gradle_build/use_gradle_build=true
gradle_build/export_format=0
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=7
version/name="0.3.0"
package/unique_name="com.vrvarna.lastchaykabender"
package/name="Last Chayka Bender"
package/signed=true
xr_features/xr_mode=1
xr_features/enable_meta_plugin=true
meta_xr_features/quest_pro_support=true
meta_xr_features/quest_2_support=true
meta_xr_features/quest_3_support=true
meta_xr_features/hand_tracking=2
meta_xr_features/hand_tracking_frequency=1
permissions/internet=false
screen/immersive_mode=true
